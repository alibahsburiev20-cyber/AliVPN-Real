name: Update VPN Configs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Aggregate public configs
        run: python scripts/aggregate.py

      - name: Commit changes
        run: |
          git config user.name "AliVPN Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/all.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update public VPN configs"
            git push
          fi
